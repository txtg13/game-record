<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏记录 - 登录注册</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:微软雅黑}
    body{display:flex;justify-content:center;align-items:center;height:100vh;background:#f5f7fa}
    .box{width:90%;max-width:400px;background:#fff;padding:30px;border-radius:12px;box-shadow:0 0 10px #eee}
    h2{text-align:center;margin-bottom:25px;color:#333}
    input{width:100%;padding:12px;margin:10px 0;border:1px #ddd solid;border-radius:6px}
    .btn{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:6px;margin-top:10px;cursor:pointer}
    .switch{text-align:center;margin-top:15px;color:#666}
    .switch span{color:#2563eb;cursor:pointer}
  </style>
</head>
<body>
  <div class="box">
    <h2>登录账号</h2>
    <input type="text" id="user" placeholder="账号">
    <input type="password" id="pwd" placeholder="密码">
    <button class="btn" onclick="login()">登录</button>
    <div class="switch">没有账号？<span onclick="goReg()">去注册</span></div>
  </div>

  <script>
function login(){
    let u = document.getElementById('user').value;
    let p = document.getElementById('pwd').value;
    fetch('/api/login',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username:u,pwd:p})
    }).then(res=>res.json()).then(ret=>{
        if(ret && ret.code===0){
            localStorage.setItem('gameUser',JSON.stringify(ret.data));
            location.href='index.html';
        }else{
            alert(ret && ret.msg ? ret.msg : '登录失败，请检查账号密码');
        }
    })
}
function goReg(){
    let u = document.getElementById('user').value;
    let p = document.getElementById('pwd').value;
    fetch('/api/register',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username:u,pwd:p})
    }).then(res=>res.json()).then(ret=>{
        if(ret && ret.code===0){
            alert(ret.msg || '注册成功，请登录');
            location.reload();
        }else{
            alert(ret && ret.msg ? ret.msg : '注册失败，请重试');
        }
    })
}
</script>
</body>
</html>
