<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日记录</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        h2 { margin-bottom: 20px; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #4285f4; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>每日记录</h2>
        <select id="gameSelect">
            <option value="明日方舟">明日方舟</option>
            <option value="明日方舟：终末地">明日方舟：终末地</option>
            <option value="原神">原神</option>
            <option value="鸣潮">鸣潮</option>
            <option value="崩坏：星穹铁道">崩坏：星穹铁道</option>
            <option value="绝区零">绝区零</option>
        </select>
        <input type="text" id="resource" placeholder="资源名称">
        <input type="number" id="amount" placeholder="今日获取数量">
        <button onclick="saveRecord()">保存记录</button>
        <button onclick="location.href='index.html'" style="background:#666; margin-top:10px;">返回首页</button>
    </div>

    <script>
        function saveRecord() {
            const game = document.getElementById('gameSelect').value;
            const resource = document.getElementById('resource').value;
            const amount = document.getElementById('amount').value;
            if (!resource || !amount) {
                alert('请填写完整信息');
                return;
            }
            alert(`已保存：${game} - ${resource} +${amount}`);
            location.href = 'index.html';
        }
    </script>
</body>
</html>
