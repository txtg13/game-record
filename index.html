<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的游戏抽卡记录</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
        body{background:#f5f5f5;padding:20px}
        .header-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px
        }
        .user-info{
            display:flex;
            align-items:center;
            gap:10px
        }
        .avatar{
            width:40px;
            height:40px;
            border-radius:50%;
            background:#ddd;
            object-fit:cover
        }
        .btn-add{
            background:#4285f4;
            color:white;
            border:none;
            padding:8px 16px;
            border-radius:5px;
            cursor:pointer
        }
        .btn-group{
            display:flex;
            gap:10px;
            margin-top:10px
        }
        .btn-blue{
            flex:1;
            background:#4285f4;
            color:white;
            border:none;
            padding:8px;
            border-radius:5px;
            cursor:pointer
        }
        .btn-gray{
            flex:1;
            background:#666;
            color:white;
            border:none;
            padding:8px;
            border-radius:5px;
            cursor:pointer
        }
        .game-group{
            margin-bottom:30px
        }
        .game-group h3{
            margin-bottom:10px;
            color:#333;
            padding-bottom:5px;
            border-bottom:1px solid #eee
        }
        .card-grid{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
            gap:15px
        }
        .game-card{
            background:white;
            border-radius:10px;
            padding:15px;
            box-shadow:0 2px 5px rgba(0,0,0,0.1)
        }
        .game-card p{
            margin:4px 0;
            color:#666;
            font-size:14px
        }
        .header-right{
            display:flex;
            gap:10px
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <div class="user-info">
            <img class="avatar" id="avatar" src="" alt="头像">
            <span id="nickname">我的游戏记录</span>
        </div>
        <div class="header-right">
            <button class="btn-add" onclick="location.href='game-config.html'">新增游戏</button>
            <button class="btn-add" onclick="location.href='setting.html'">个人设置</button>
            <button class="btn-add" style="background:#dc3545" onclick="logout()">退出登录</button>
        </div>
    </div>

    <div id="gameList"></div>

    <script>
        window.onload = function(){
            let user = JSON.parse(localStorage.getItem('gameUser') || '{}');
            if(!user.username){
                location.href='login.html';
                return;
            }

            // 加载用户设置（头像+昵称）
            fetch('/api/getSettings',{
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({username:user.username})
            }).then(res=>res.json()).then(data=>{
                if(data.data){
                    document.getElementById('nickname').innerText = data.data.nickname || user.username;
                    document.getElementById('avatar').src = data.data.avatar || 'https://via.placeholder.com/40';
                }
            })

            // 加载并分组游戏数据
            fetch('/api/games')
            .then(res => res.json())
            .then(data => {
                if(data.code === 0){
                    renderGames(data.data);
                }
            })

            function renderGames(list){
                let container = document.getElementById('gameList');
                container.innerHTML = '';

                // 按游戏名分组
                let groups = {};
                list.forEach(item => {
                    if(!groups[item.gameName]){
                        groups[item.gameName] = [];
                    }
                    groups[item.gameName].push(item);
                })

                // 渲染分组
                for(let name in groups){
                    let groupDiv = document.createElement('div');
                    groupDiv.className = 'game-group';
                    groupDiv.innerHTML = `<h3>${name}</h3><div class="card-grid"></div>`;
                    container.appendChild(groupDiv);

                    let grid = groupDiv.querySelector('.card-grid');
                    groups[name].forEach(item => {
                        let card = document.createElement('div');
                        card.className = 'game-card';
                        card.innerHTML = `
                            <p><strong>资源：</strong>${item.itemName}</p>
                            <p><strong>单抽消耗：</strong>${item.onceCost}</p>
                            <p><strong>比例：</strong>${item.ratio}</p>
                            <div class="btn-group">
                                <button class="btn-blue" onclick="location.href='daily.html'">每日记录</button>
                                <button class="btn-gray" onclick="location.href='game-config.html'">游戏配置</button>
                            </div>
                        `;
                        grid.appendChild(card);
                    })
                }
            }

            function logout(){
                localStorage.removeItem('gameUser');
                location.href='login.html';
            }
        }
    </script>
</body>
</html>
