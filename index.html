<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏抽卡记录</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
        body{background:#f5f5f5;padding:20px}
        .title{text-align:center;margin-bottom:20px}
        .game-card{
            background:white;
            border-radius:10px;
            padding:15px;
            margin:10px auto;
            max-width:400px;
            box-shadow:0 2px 5px rgba(0,0,0,0.1)
        }
        .game-card h3{
            margin-bottom:8px;
            color:#333
        }
        .game-card p{
            margin:4px 0;
            color:#666
        }
        .btn-group{
            margin-top:10px;
            display:flex;
            gap:10px
        }
        button{
            flex:1;
            padding:8px;
            border:none;
            border-radius:5px;
            background:#4285f4;
            color:white;
            cursor:pointer
        }
        button:nth-child(2){
            background:#666
        }
    </style>
</head>
<body>
    <h2 class="title">我的游戏抽卡记录</h2>
    <div id="gameList"></div>

    <script>
        window.onload = function(){
            // 检查登录
            let user = JSON.parse(localStorage.getItem('gameUser') || '{}');
            if(!user.username){
                location.href = 'login.html';
                return;
            }

            // 加载游戏数据
            fetch('/api/games')
            .then(res => res.json())
            .then(data => {
                if(data.code === 0){
                    renderList(data.data);
                }
            })

            // 渲染游戏列表
            function renderList(list){
                let box = document.getElementById('gameList');
                box.innerHTML = '';

                list.forEach(item => {
                    let card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `
                        <h3>${item.gameName}</h3>
                        <p>资源：${item.itemName}</p>
                        <p>单抽消耗：${item.onceCost}</p>
                        <p>比例：${item.ratio}</p>
                        <div class="btn-group">
                            <button onclick="location.href='daily.html'">每日记录</button>
                            <button onclick="location.href='game-config.html'">游戏配置</button>
                        </div>
                    `;
                    box.appendChild(card);
                });
            }
        }
    </script>
</body>
</html>
