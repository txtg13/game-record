<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏记录总览</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:微软雅黑}
    body{background:#f5f7fa;padding:15px}
    .header{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:15px;border-radius:10px;margin-bottom:15px;flex-wrap:wrap;gap:10px}
    .avatar{width:50px;height:50px;border-radius:50%;object-fit:cover;border:2px #2563eb solid}
    .btn{padding:8px 15px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;margin:2px}
    .card-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px;margin-top:15px}
    .card{background:#fff;padding:15px;border-radius:10px;box-shadow:0 2px 8px #eee}
    .card h3{margin-bottom:10px;color:#333}
    .card p{color:#666;margin:4px 0}
    .card-btn{margin-top:12px;display:flex;gap:10px}
  </style>
</head>
<body>
  <div class="header">
    <img class="avatar" id="avatar" src="">
    <h3>我的游戏记录</h3>
    <div>
      <button class="btn" onclick="location.href='profile.html'">个人头像设置</button>
      <button class="btn" onclick="logout()">退出登录</button>
    </div>
  </div>

  <button class="btn" onclick="addGame()">➕ 新增游戏</button>
  <div class="card-list" id="gameList"></div>

  <script>
    let user = JSON.parse(localStorage.getItem('gameUser'));
    if(!user) location.href='login.html';
    document.getElementById('avatar').src = user.avatar || 'https://via.placeholder.com/50';

    function logout(){
      localStorage.removeItem('gameUser');
      location.href='login.html';
    }

    function loadGames(){
      fetch('/api/games').then(res=>res.json()).then(ret=>{
        let html = '';
        ret.data.forEach(game=>{
          html += `
            <div class="card">
              <h3>${game.name}</h3>
              <p>资源名称：${game.resName}</p>
              <p>单抽消耗：${game.singleCost}</p>
              <p>UP池保底：${game.upMax} 发</p>
              <p>常驻池保底：${game.normalMax} 发</p>
              <div class="card-btn">
                <button class="btn" onclick="goDetail('${game.id}')">每日记录</button>
                <button class="btn" onclick="goConfig('${game.id}')">游戏配置</button>
              </div>
            </div>
          `;
        });
        document.getElementById('gameList').innerHTML = html;
      })
    }
    function goDetail(id){location.href=`game-detail.html?id=${id}`}
    function goConfig(id){location.href=`game-config.html?id=${id}`}
    function addGame(){location.href='game-config.html'}
    loadGames();
  </script>
</body>
</html>
