<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增游戏配置</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial; }
        body { background: #f5f5f5; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 10px; width: 100%; max-width: 600px; }
        input { display: block; width: 100%; margin: 15px 0; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        .btn-blue { background: #4285f4; color: white; border: none; padding: 12px; border-radius: 5px; width: 100%; font-size: 16px; margin-top: 10px; cursor: pointer; }
        .btn-gray { background: #666; color: white; border: none; padding: 12px; border-radius: 5px; width: 100%; font-size: 16px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <input type="text" id="gameName" placeholder="游戏名称" value="原神">
        <input type="text" id="itemName" placeholder="物品名称" value="原石">
        <input type="number" id="itemCount" placeholder="数量" value="160">
        <input type="number" id="itemPrice" placeholder="单价" value="90">
        <input type="number" id="totalPrice" placeholder="总价" value="90">
        
        <button class="btn-blue" onclick="saveGame()">保存配置</button>
        <button class="btn-gray" onclick="location.href='index.html'">返回</button>
    </div>

    <script>
        function saveGame() {
            const gameName = document.getElementById('gameName').value;
            const itemName = document.getElementById('itemName').value;
            const itemCount = document.getElementById('itemCount').value;
            const itemPrice = document.getElementById('itemPrice').value;
            const totalPrice = document.getElementById('totalPrice').value;

            if (!gameName || !itemName) {
                alert('游戏名称和物品名称不能为空');
                return;
            }

            fetch('/api/games', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    gameName,
                    itemName,
                    itemCount,
                    itemPrice,
                    totalPrice
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data && data.code === 0) {
                    alert('保存成功！');
                    location.href = 'index.html';
                } else {
                    alert(data.msg || '保存失败，请重试');
                }
            })
            .catch(err => {
                alert('网络错误，请稍后再试');
            });
        }
    </script>
</body>
</html>
