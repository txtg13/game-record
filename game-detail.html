<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏详情</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .calendar { padding: 10px; background: white; border-radius: 5px; }
        .container { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .bar-chart { height: 200px; display: flex; align-items: flex-end; gap: 10px; padding: 10px; background: #fafafa; border-radius: 5px; }
        .bar { width: 30px; background: #4285f4; border-radius: 3px 3px 0 0; }
    </style>
</head>
<body>
    <div class="header">
        <h2 id="gameTitle">游戏名称</h2>
        <input type="date" class="calendar" id="calendar">
    </div>

    <div class="container">
        <div class="card">
            <h3>资源记录</h3>
            <div id="resourceList"></div>
        </div>
        <div class="card">
            <h3>资源柱状图</h3>
            <div class="bar-chart" id="barChart"></div>
        </div>
    </div>

    <button onclick="location.href='index.html'" style="margin-top:20px; padding:10px 20px; background:#666; color:white; border:none; border-radius:5px;">返回首页</button>

    <script>
        window.onload = function() {
            // 模拟数据，后续可对接后端
            const gameData = {
                name: "明日方舟",
                resources: [
                    { name: "合成玉", count: 6000 },
                    { name: "源石", count: 100 },
                    { name: "抽卡券", count: 50 }
                ]
            };

            document.getElementById('gameTitle').innerText = gameData.name;
            document.getElementById('calendar').valueAsDate = new Date();

            // 渲染资源列表
            const list = document.getElementById('resourceList');
            gameData.resources.forEach(r => {
                const p = document.createElement('p');
                p.textContent = `${r.name}: ${r.count}`;
                list.appendChild(p);
            });

            // 渲染柱状图
            const chart = document.getElementById('barChart');
            const max = Math.max(...gameData.resources.map(r => r.count));
            gameData.resources.forEach(r => {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = `${(r.count / max) * 100}%`;
                bar.title = `${r.name}: ${r.count}`;
                chart.appendChild(bar);
            });
        }
    </script>
</body>
</html>
