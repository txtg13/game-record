<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日记录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:微软雅黑}
body{background:#f5f7fa;padding:20px}
.box{max-width:400px;background:white;padding:20px;border-radius:12px;margin:0 auto}
input,textarea{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:6px}
.btn{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:6px;margin-top:10px}
.img{max-width:100%;margin-top:10px;border-radius:6px}
</style>
</head>
<body>
<div class="box">
  <input id="login" type="checkbox" label="今日已登录"> 今日已登录<br>
  <input id="daily" type="checkbox"> 日常已完成<br>
  <input id="res" placeholder="当前资源数量">
  <input id="up" placeholder="UP池垫抽">
  <input id="normal" placeholder="常驻池垫抽">
  <textarea id="note" placeholder="备注"></textarea>
  <input type="file" id="img" style="display:none" accept="image/*">
  <button class="btn" onclick="document.getElementById('img').click()">上传出货截图</button>
  <img id="showImg" class="img">
  <button class="btn" onclick="save()">保存今日记录</button>
  <button class="btn" style="background:#666" onclick="location.href='index.html'">返回</button>
</div>

<script>
let user = JSON.parse(localStorage.gameUser||"{}");
if(!user.username)location.href='login.html';
let gameId = new URLSearch(location.search).get("id");
let imgUrl = "";

document.getElementById("img").onchange = async e=>{
  let fd = new FormData();
  fd.append("img", e.target.files[0]);
  let res = await fetch("/api/upload-img",{method:"POST",body:fd});
  let json = await res.json();
  imgUrl = json.url;
  document.getElementById("showImg").src = imgUrl;
}

async function save(){
  let data = {
    date:new Date().toLocaleDateString(),
    gameId, user:user.username,
    login:document.getElementById("login").checked,
    daily:document.getElementById("daily").checked,
    res:document.getElementById("res").value,
    up:document.getElementById("up").value,
    normal:document.getElementById("normal").value,
    note:document.getElementById("note").value,
    imgUrl
  };
  await fetch("/api/save-record",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(data)
  });
  alert("保存成功！云端同步");
}
</script>
</html>
